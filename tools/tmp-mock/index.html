<!doctype html><html lang="ru"><meta charset="utf-8"><title>mock</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#02050a;color:#e8faff;font-family:Montserrat,'Segoe UI',Arial,sans-serif}
#stage{width:1920px;height:1080px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,#08202c,#02060b 70%)}
.topbar{height:130px;background:rgba(8,20,28,.8);border-bottom:1px solid rgba(86,217,242,.25);display:flex;align-items:center;justify-content:center;color:#6e96a2;font-size:15px}
.view{position:absolute;left:36px;right:36px;top:190px;bottom:24px;padding:0 56px;display:grid;gap:18px}
header.h{display:flex;justify-content:space-between;align-items:flex-start}h1{margin:0;font-size:34px;font-weight:800}header.h p{margin:6px 0 0;color:#a9cbd3;font-size:16px}
.back{height:46px;padding:0 20px;border:1px solid rgba(126,200,220,.3);border-radius:10px;display:flex;align-items:center;font-weight:700;font-size:14px}
.panel{border-radius:18px;background:linear-gradient(180deg,rgba(14,32,42,.6),rgba(6,16,22,.94));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 50px rgba(0,0,0,.35);position:relative;overflow:hidden}
.big{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.lab{color:#a9cbd3;font-size:17px}
.btn{height:68px;border-radius:10px;background:linear-gradient(180deg,#63e0f6,#2aa9c9);color:#04202a;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0 34px;box-shadow:0 0 30px rgba(86,217,242,.45)}
.chips{display:flex;gap:8px}.chip{height:40px;padding:0 14px;border-radius:9px;background:rgba(86,217,242,.08);border:1px solid rgba(126,200,220,.25);font-weight:700;font-size:15px;display:flex;align-items:center}.chip.on{background:rgba(86,217,242,.22);border-color:#56d9f2}
.bay{--c:#b9c6d6;padding:18px 22px;display:flex;flex-direction:column;gap:6px}.bay.m{--c:#7d8cff}.bay.g{--c:#4ee0a0}.bay::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%);pointer-events:none}
.bay .t{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800}.bay img{width:36px;height:36px}.bay .pct{margin-left:auto;font-size:30px;font-weight:800;color:var(--c)}
.bay .get{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}.cells{display:flex;gap:4px;align-items:center}.cells i{flex:1;height:18px;border-radius:4px;background:rgba(140,200,215,.13)}.cells i.on{background:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 60%,transparent)}.st{width:36px;height:36px;flex:0 0 36px;border:1px solid rgba(126,200,220,.3);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.slots{display:grid;gap:8px}.slot{display:grid;justify-items:center;gap:4px;font-variant-numeric:tabular-nums}
.ring{--p:0;--col:#56d9f2;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--col) calc(var(--p)*1%),rgba(140,200,215,.13) 0);display:grid;place-items:center;position:relative}.ring::after{content:'';position:absolute;inset:7px;border-radius:50%;background:#071720}.ring img{width:44px;height:44px;z-index:1}
.slot b{font-size:18px;font-weight:800}.slot small{font-size:14px;color:#a9cbd3}
.slot.ready .ring{--col:#35e58a;--p:100;box-shadow:0 0 22px rgba(53,229,138,.5)}.slot.ready b{color:#35e58a}
.slot.sel .ring{--col:#e6ad50;--p:100;}.slot.sel b{color:#e6ad50}
.slot.lock{opacity:.35}
</style>
<body><div id="stage"><div class="topbar">(шапка игры)</div><div class="view" id="v"></div></div>
<script>
const P='../../';
const I={metal:P+'src/assets/ui/header-icons/metal.png',min:P+'src/assets/ui/header-icons/mineral.png',gas:P+'src/assets/ui/header-icons/gas.png',deb:P+'src/assets/ui/header-icons/debris.png'};
const ART=P+'assets/source/New assets/buildings/aegis/building.aegis.recycling.png',PILE=P+'assets/source/universe-navigation/debris/debris.variant-01.png';
const head=`<header class="h"><div><h1>Перерабатывающий центр</h1><p>Уровень 10 · Москва · выход 120% · каждый процесс 980 обломков/с</p></div><div class="back">← Назад</div></header>`;
const cells=(n)=>Array.from({length:10},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('');
const bay=(c,name,ic,p,get)=>`<article class="panel bay ${c}"><div class="t"><img src="${ic}">${name}<span class="pct">${p}%</span></div><div class="get">${get}</div><div class="cells"><span class="st">−</span>${cells(Math.round(p/10))}<span class="st">+</span></div></article>`;
const bays=()=>bay('','Металл',I.metal,50,'120 млн')+bay('m','Минералы',I.min,30,'72 млн')+bay('g','Газ',I.gas,20,'48 млн');
const slot=(k,i)=>{const d={run:[`Осталось`,'03:12',55],ready:['Готово','Забрать',100],sel:['20 млн','Новый',100],lock:['ур. '+(i+1),'',0]}[k];return `<div class="slot ${k==='run'?'':k}"><div class="ring" style="--p:${d[2]}"><img src="${I.deb}"></div><b>${d[1]||d[0]}</b><small>${d[1]?d[0]:''}</small></div>`};
const slots=['ready','run','run','run','run','run','sel','sel','sel','sel'];
const V=new URLSearchParams(location.search).get('v')||'a';
const pile=(h)=>`<div style="display:flex;align-items:center;gap:20px"><img src="${PILE}" style="height:${h}px"><div><div class="lab">Свободные обломки</div><div class="big">200 000 000</div><div class="chips" style="margin-top:12px"><span class="chip">25%</span><span class="chip">50%</span><span class="chip">75%</span><span class="chip on">Всё</span></div></div></div>`;
const go=`<div class="btn">Запустить 4 процесса</div>`;
const sum=`<div class="lab">80 млн обломков → <b style="color:#fff">96 млн ресурсов</b> · готово через <b style="color:#fff">04:05</b></div>`;
if(V==='a'){ // flow: pile -> building -> bays, slots below
 document.getElementById('v').style.gridTemplateRows='auto minmax(0,1fr) auto';
 document.getElementById('v').innerHTML=head+`<div style="display:grid;grid-template-columns:minmax(0,1fr) 420px minmax(0,1fr);gap:24px;min-height:0">
 <section class="panel" style="padding:24px 28px;display:flex;flex-direction:column;justify-content:center">${pile(200)}</section>
 <section style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px"><img src="${ART}" style="height:230px;filter:drop-shadow(0 14px 22px #000)">${go}${sum.replace('style="','style="text-align:center;')}</section>
 <section style="display:grid;grid-template-rows:repeat(3,1fr);gap:10px">${bays().replaceAll('padding','p')}</section></div>
 <section class="panel" style="padding:16px 28px"><div class="slots" style="grid-template-columns:repeat(10,1fr)">${slots.map(slot).join('')}</div></section>`;
}
if(V==='b'){ // robots family: three bays, slots strip, dock
 document.getElementById('v').style.gridTemplateRows='auto auto auto auto';
 document.getElementById('v').innerHTML=head+`<section class="panel" style="padding:14px 28px"><div class="slots" style="grid-template-columns:repeat(10,1fr)">${slots.map(slot).join('')}</div></section>
 <section style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;">${bays()}</section>
 <section class="panel" style="padding:18px 30px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:32px;align-items:center">${pile(170)}<div style="text-align:right">${sum}</div>${go}</section>`;
}
if(V==='c'){ // reactor: 5 slots | building | 5 slots; bays + dock below
 document.getElementById('v').style.gridTemplateRows='auto minmax(0,1fr) auto auto';
 document.getElementById('v').innerHTML=head+`<div style="display:grid;grid-template-columns:minmax(0,1fr) 380px minmax(0,1fr);gap:16px;align-items:center;min-height:0">
 <div class="slots" style="grid-template-columns:repeat(5,1fr)">${slots.slice(0,5).map(slot).join('')}</div>
 <div style="display:grid;place-items:center;position:relative"><div style="position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(86,217,242,.25),transparent 65%)"></div><img src="${ART}" style="height:240px;position:relative;filter:drop-shadow(0 14px 22px #000)"></div>
 <div class="slots" style="grid-template-columns:repeat(5,1fr)">${slots.slice(5).map(slot).join('')}</div></div>
 <section style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;">${bays()}</section>
 <section class="panel" style="padding:12px 30px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:32px;align-items:center">${pile(120)}<div style="text-align:right">${sum}</div>${go}</section>`;
}
</script></body></html>
