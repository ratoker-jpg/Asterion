<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>M1 Хроника</title>
<link rel="stylesheet" href="../frame.css"><link rel="stylesheet" href="base.css">
<style>
.col { position: absolute; left: 32px; top: 24px; bottom: 24px; width: 600px; display: flex; flex-direction: column; }
.cats { display: flex; justify-content: space-between; padding: 0 4px; }
.cat { position: relative; width: 80px; height: 80px; }
.cat .circ { width: 80px; height: 80px; }
.cat .circ.pad > img { padding: 16%; }
.cat.on .circ { box-shadow: 0 0 0 3px var(--cyan), 0 0 22px rgba(86, 217, 242, .45); }
.cat .badge { right: -8px; top: -6px; }
.cat-name { display: flex; align-items: baseline; gap: 14px; margin: 22px 6px 10px; }
.cat-name b { font-size: 30px; font-weight: 800; }
.cat-name span { font-size: 20px; color: var(--cyan); font-weight: 700; }
.cat-name .btn { margin-left: auto; height: 48px; line-height: 48px; font-size: 18px; padding: 0 20px; }
.feed { position: relative; flex: 1; overflow: hidden; -webkit-mask: linear-gradient(#000 88%, transparent); }
.feed::before { content: ''; position: absolute; left: 41px; top: 0; bottom: 0; width: 2px; background: linear-gradient(var(--cyan), rgba(86, 217, 242, .05)); opacity: .45; }
.day { position: relative; margin: 10px 0 6px 92px; font-size: 18px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.row { position: relative; display: flex; align-items: center; gap: 18px; min-height: 84px; padding-top: 6px; padding-bottom: 6px; padding: 0 14px 0 6px; border-radius: 40px; animation: rise .5s both; }
.row .circ { width: 72px; height: 72px; }
.row.unread .circ { animation: pulse 2.4s infinite; }
.row .t { flex: 1; min-width: 0; }
.row .t b { font-size: 20px; font-weight: 700; line-height: 1.25; }
.row .t small { display: block; font-size: 17px; color: var(--ink-3); margin-top: 3px; }
.row:not(.unread) .t b { color: var(--ink-2); font-weight: 600; }
.row .v { font-size: 24px; font-weight: 800; white-space: nowrap; }
.row.sel { background: linear-gradient(90deg, rgba(86, 217, 242, .18), rgba(86, 217, 242, .03)); }
.row.sel::after { content: ''; position: absolute; right: -32px; top: 50%; border: 14px solid transparent; border-left-color: rgba(86, 217, 242, .5); transform: translateY(-50%); }

.drawer { position: absolute; left: 664px; right: 32px; top: 100px; bottom: 24px; border-radius: 28px; overflow: hidden; background: #060c18; animation: slideL .6s .1s both; box-shadow: 0 30px 80px rgba(0, 0, 0, .6), inset 0 0 0 1.5px rgba(86, 217, 242, .18); }
.drawer .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
.drawer .bg-fade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4, 8, 16, .2), rgba(4, 8, 16, .55) 45%, rgba(4, 8, 16, .96) 72%); }
.drawer .in { position: absolute; inset: 0; padding: 36px 44px 28px; display: flex; flex-direction: column; }
.duel { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; }
.side { display: flex; flex-direction: column; align-items: center; gap: 16px; min-width: 0; text-align: center; }
.side .circ { width: 128px; height: 128px; box-shadow: 0 0 0 3px var(--cyan), 0 0 40px rgba(86, 217, 242, .35); }
.side.r .circ { box-shadow: 0 0 0 3px var(--red), 0 0 40px rgba(255, 90, 106, .35); }
.side .nm { min-width: 0; }
.side .nm b { font-size: 22px; font-weight: 800; line-height: 1.25; }
.side .nm span { display: block; margin-top: 6px; font-size: 19px; font-weight: 700; color: var(--cyan); }
.verdict { text-align: center; }
.verdict b { display: block; font-size: 60px; font-weight: 900; letter-spacing: .04em; color: var(--green); text-shadow: 0 0 30px rgba(95, 227, 161, .5); }
.verdict span { font-size: 19px; color: var(--ink-2); }
.eq { display: flex; align-items: center; justify-content: center; gap: 34px; margin-top: 30px; }
.term { text-align: center; }
.term .ic { display: flex; justify-content: center; gap: 6px; height: 52px; }
.term .ic img { width: 52px; height: 52px; object-fit: contain; }
.term b { display: block; font-size: 40px; font-weight: 800; margin-top: 8px; }
.term small { display: block; font-size: 18px; color: var(--ink-2); margin-top: 2px; }
.term.big b { font-size: 76px; line-height: 1; color: var(--green); text-shadow: 0 0 40px rgba(95, 227, 161, .45); }
.op { font-size: 46px; font-weight: 300; color: var(--ink-3); }
.fleets { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; margin-top: auto; }
.fl h4 { display: flex; justify-content: space-between; font-size: 19px; font-weight: 700; color: var(--ink-2); }
.fl h4 b { color: var(--ink); }
.bar { position: relative; height: 12px; border-radius: 6px; margin: 12px 0 18px; background: rgba(255, 90, 106, .35); overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, #2fb6d6, var(--cyan)); transform-origin: left; animation: grow 1.2s .5s both; }
.ships { display: flex; gap: 22px; }
.sh { width: 104px; text-align: center; }
.ring { width: 104px; height: 104px; border-radius: 50%; padding: 6px; background: conic-gradient(var(--red) calc(var(--p) * 1%), rgba(86, 217, 242, .35) 0); }
.ring .circ { width: 92px; height: 92px; }
.ring .circ img { object-fit: contain; padding: 10%; }
.sh b { display: block; margin-top: 8px; font-size: 20px; font-weight: 800; }
.sh small { display: block; font-size: 18px; font-weight: 700; color: var(--red); }
.acts { display: flex; gap: 16px; margin-top: 26px; }
.acts .sp { flex: 1; }
</style></head>
<body><div class="stage"><img class="hdr" src="../assets/game-header.png"><main class="area">
  <div class="col">
    <div class="cats" id="cats"></div>
    <div class="cat-name when-full"><b>Все</b><span id="cnt"></span><button class="btn">Прочитать все</button></div>
    <div class="feed when-full" id="feed"></div>
  </div>
  <section class="drawer when-full" id="drawer"></section>
  <div class="empty-state" style="left:664px"><img src="" id="emptyImg" alt=""><b>Писем пока нет</b><span>Отчёты о боях и полётах появятся здесь</span></div>
</main></div>
<script src="../frame.js"></script><script src="data.js"></script>
<script>
const { A, fmt, short, CATS, items, battle: B } = MSG;
document.getElementById('emptyImg').src = A.empty;
const pic = (x) => x.cat === 'battle' && x.kind !== 'sun' ? A.face(x.fac) : x.kind === 'sun' ? A.sun : x.cat === 'fleet' || x.kind === 'spy' ? A.planet(x.planet) : A.icon(x.icon);
const pad = (x) => !(x.cat === 'battle' && x.kind !== 'sun') && !(x.cat === 'fleet' || x.kind === 'spy');
document.getElementById('cats').innerHTML = CATS.map((c, i) => {
  const n = items.filter((x) => x.unread && (c.id === 'all' || x.cat === c.id)).length;
  return `<div class="cat ${i === 0 ? 'on' : ''}"><div class="circ pad"><img src="${A.icon(c.icon)}"></div>${n ? `<span class="badge">${n > 99 ? '99+' : n}</span>` : ''}</div>`;
}).join('');
document.getElementById('cnt').textContent = `${items.filter((x) => x.unread).length} новых`;
let html = '', day = '';
items.slice(0, 12).forEach((x, i) => {
  if (x.day !== day) { day = x.day; html += `<div class="day">${day}</div>`; }
  const v = x.value ? `<span class="v ${x.tone === 'info' ? 'info' : x.value > 0 ? 'ok' : 'bad'}">${x.tone === 'info' ? short(x.value).replace('+', '') : short(x.value)}</span>` : '';
  html += `<div class="row ${x.unread ? 'unread' : ''} ${i === 0 ? 'sel' : ''}" style="animation-delay:${i * 40}ms"><div class="circ ${pad(x) ? 'pad' : ''}"><img src="${pic(x)}"></div><div class="t"><b class="clamp2">${x.who}</b><small><span class="${x.tone}">${x.title}</span> · ${x.time}</small></div>${v}</div>`;
});
document.getElementById('feed').innerHTML = html;
const lootSum = B.loot.metal + B.loot.mineral + B.loot.gas;
const ship = (race, s) => `<div class="sh"><div class="ring" style="--p:${s[2] ? Math.round(s[3] / s[2] * 100) : 0}"><div class="circ"><img src="${A.ship(race, s[0])}"></div></div><b>${short(s[2]).replace('+', '')}</b><small>${s[3] ? short(-s[3]) : '0'}</small></div>`;
document.getElementById('drawer').innerHTML = `<img class="bg" src="${A.spaceBg}"><div class="bg-fade"></div><div class="in">
  <div class="duel">
    <div class="side"><div class="circ"><img src="${A.face(B.me.fac)}"></div><div class="nm"><b class="clamp2">${B.me.name}</b><span>[${B.me.coord}]</span></div></div>
    <div class="verdict"><b>ПОБЕДА</b><span>Атака · ${B.rounds} раундов · 23:41</span></div>
    <div class="side r"><div class="circ"><img src="${A.face(B.foe.fac)}"></div><div class="nm"><b class="clamp2">${B.foe.name}</b><span>[${B.foe.coord}]</span></div></div>
  </div>
  <div class="eq">
    <div class="term"><div class="ic"><img src="${A.res('metal')}"><img src="${A.res('mineral')}"><img src="${A.res('gas')}"></div><b class="ok">${short(lootSum)}</b><small>добыча</small></div>
    <span class="op">−</span>
    <div class="term"><div class="ic"><img src="${A.ship('synod', 'frigate')}"></div><b class="bad">${short(B.lostValue).replace('+', '')}</b><small>цена потерь</small></div>
    <span class="op">=</span>
    <div class="term big"><b data-count="${B.profit}">${short(B.profit)}</b><small>чистая прибыль</small></div>
  </div>
  <div class="fleets">
    <div class="fl"><h4><span>Мой флот</span><b>${fmt(B.me.before)} → ${fmt(B.me.after)}</b></h4><div class="bar"><i style="width:${B.me.after / B.me.before * 100}%"></i></div><div class="ships">${B.myShips.slice(0, 3).map((s) => ship(B.me.race, s)).join('')}</div></div>
    <div class="fl"><h4><span>Противник</span><b>${fmt(B.foe.before)} → 0</b></h4><div class="bar"><i style="width:0%"></i></div><div class="ships">${B.foeShips.map((s) => ship(B.foe.race, s)).join('')}</div></div>
  </div>
  <div class="acts">
    <button class="btn primary">Ударить снова</button>
    <button class="btn"><img class="resi" src="${A.res('debris')}">Собрать ${short(B.debris).replace('+', '')}</button>
    <button class="btn">Раунды боя</button>
    <span class="sp"></span>
    <button class="btn icon" title="Сохранить"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
    <button class="btn icon danger" title="Удалить"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  </div></div>`;
</script></body></html>
