<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Рейсы и миссии · в стиле текущих Флотов</title>
<link rel="stylesheet" href="../frame.css">
<style>
:root { --dim: #8b97aa; --line: rgba(150,180,220,.10); --cyan: #56d9f2; --red: #ff4d5e; --card: rgba(14,22,33,.86); }
.stage { background: #03060c url(../../../assets/source/battle-report-v2/battle-space-background-v1.png) center/cover; }
.stage::before { content: ''; position: absolute; inset: 0; background: rgba(3,6,12,.78); }
.area { top: 200px; padding: 14px 52px 0; }
.chips { display: flex; gap: 10px; align-items: center; justify-content: flex-end; height: 46px; }
.chip { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px; border-radius: 10px; background: var(--card); font-size: 15px; color: var(--dim); font-weight: 600; }
.chip b { color: #fff; font-size: 16px; } .chip.red { background: rgba(255,77,94,.16); color: #ffb3ba; } .chip.red b { color: var(--red); }
.chip img { width: 26px; height: 26px; border-radius: 50%; }
.ttl { margin-right: auto; display: flex; align-items: baseline; gap: 14px; } .ttl b { font-size: 26px; font-weight: 800; } .ttl span { font-size: 15px; color: var(--dim); }
.btn { font: inherit; font-size: 15px; font-weight: 700; color: #dfe7f2; background: #172232; border: 0; border-radius: 10px; padding: 10px 16px; white-space: nowrap; }
.btn.pri { color: #04121b; background: linear-gradient(#7ee8fb, #3fc0e6); box-shadow: 0 0 20px rgba(86,217,242,.35); }
.btn.red { color: #fff; background: linear-gradient(#ff6a78, #d93446); }
.list { position: absolute; left: 52px; right: 52px; top: 74px; bottom: 214px; overflow: hidden; }
.sec { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; color: var(--dim); margin: 14px 0 8px; }
.sec.red { color: #ff7a86; }
.row { display: grid; grid-template-columns: 260px 270px 28px 270px 190px 175px 200px 1fr auto; align-items: center; min-height: 64px; padding: 6px 14px; margin-bottom: 6px; border-radius: 12px; background: var(--card); }
.row.sel { box-shadow: inset 0 0 0 2px rgba(86,217,242,.7); }
.row.hot { background: linear-gradient(90deg, rgba(120,20,32,.65), rgba(40,12,18,.8)); box-shadow: inset 0 0 0 1px rgba(255,77,94,.5); min-height: 76px; }
.row.hot.sel { box-shadow: inset 0 0 0 2px #ff4d5e, 0 0 24px rgba(255,77,94,.25); }
.mis { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; }
.mis img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; }
.mis b { display: block; font-size: 17px; font-weight: 800; } .mis small { font-size: 13px; color: var(--dim); }
.pl { display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: center; padding-right: 10px; }
.pl img { width: 38px; height: 38px; object-fit: contain; } .pl .ico { border-radius: 50%; }
.pl b { display: block; font-size: 15px; font-weight: 700; line-height: 1.2; } .pl small { font-size: 13px; color: var(--cyan); font-weight: 700; }
.arr { color: var(--cyan); font-size: 18px; } .hot .arr { color: var(--red); }
.st span { display: inline-block; font-size: 14px; font-weight: 800; padding: 4px 10px; border-radius: 8px; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); margin-bottom: 8px; }
.st i { display: block; width: 160px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); position: relative; overflow: hidden; }
.st i::after { content: ''; position: absolute; inset: 0 auto 0 0; width: var(--p); background: var(--c); }
.tm small { display: block; font-size: 13px; color: var(--dim); } .tm b { font-size: 22px; font-weight: 800; } .hot .tm b { color: var(--red); font-size: 28px; }
.sh { display: flex; align-items: center; gap: 6px; } .sh img { width: 46px; height: 32px; object-fit: contain; } .sh b { font-size: 16px; font-weight: 800; margin-right: 6px; } .sh small { font-size: 13px; color: var(--dim); margin-right: 14px; }
.cg { display: flex; flex-wrap: wrap; gap: 4px 14px; } .cg span { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; } .cg img { width: 24px; height: 24px; } .cg .none { color: #4a5465; }
.ac { display: flex; gap: 8px; }
.more { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: linear-gradient(transparent, rgba(3,6,12,.95)); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 14px; color: var(--cyan); font-weight: 700; }
/* the same big mission card the current Fleets screen already has, now for the picked flight */
.ban { position: absolute; left: 52px; right: 52px; bottom: 22px; height: 176px; border-radius: 16px; overflow: hidden; background-size: cover; background-position: right center; }
.ban::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6,10,17,.97) 0, rgba(6,10,17,.88) 38%, rgba(6,10,17,.2) 70%); }
.ban > div { position: relative; padding: 22px 34px; display: grid; grid-template-columns: auto 1fr auto; gap: 40px; align-items: end; height: 100%; }
.ban .k { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; color: #ff7a86; }
.ban h2 { font-size: 42px; font-weight: 800; line-height: 1.05; margin: 4px 0 8px; } .ban h2 em { font-style: normal; color: var(--red); }
.ban p { font-size: 16px; color: #c2ccda; }
.ban .stats { display: flex; gap: 34px; align-self: end; padding-bottom: 6px; } .ban .stats span { font-size: 15px; color: var(--dim); } .ban .stats b { font-size: 22px; color: #fff; margin-left: 8px; }
.ban .bt { display: flex; gap: 10px; } .ban .bt .btn { font-size: 18px; padding: 16px 26px; border-radius: 12px; }
.empty { text-align: center; margin-top: 90px; } .empty img { width: 360px; margin: 0 auto 18px; } .empty b { font-size: 26px; display: block; } .empty span { font-size: 16px; color: var(--dim); display: block; margin: 8px 0 22px; }
</style></head><body>
<div class="stage"><img class="hdr" src="../assets/header-fleets-now.png"><main class="area" id="a"></main></div>
<script src="../fleets/data.js"></script>
<script>
FLIGHTS.forEach((f) => { f.sent = f.phase === 'back' ? f.T * 2 - f.t : f.phase === 'work' ? f.T + 600 : f.T - f.t; });
const now = 23 * 3600 + 41 * 60;
const clock = (sec) => { const s = ((now + sec) % 86400 + 86400) % 86400; return `${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}`; };
const STATE = { out: 'Летит туда', work: 'На месте', back: 'Возвращается' };
const place = (o, ico) => `<div class="pl">${o.p ? `<img src="${PLANET(o.p)}">` : `<img class="ico" src="${ICON(ico)}">`}<div><b>${o.name}</b><small>${o.c === '—' ? '' : `[${o.c}]`}</small></div></div>`;
function row(f, sel) {
  const M = MISSION[f.m], col = f.hostile ? '#ff4d5e' : GROUP_COLOR[M.group];
  const a = f.hostile ? f.from : HOME[f.home], b = f.hostile ? HOME[f.home] : f.to;
  const when = f.hostile ? 'удар в ' + clock(f.t) : f.phase === 'back' ? 'дома в ' + clock(f.t) : f.phase === 'work' ? 'свободен в ' + clock(f.t) : 'прибытие в ' + clock(f.t);
  const acts = f.hostile ? '<button class="btn red">Увести флот</button>' : `${f.phase !== 'back' ? '<button class="btn">Отозвать</button>' : ''}<button class="btn">Повторить</button>`;
  return `<div class="row ${f.hostile ? 'hot' : ''} ${sel ? 'sel' : ''}" style="--c:${col}">
    <div class="mis"><img src="${BANNER(M.banner)}" style="object-position:right center"><div><b>${M.label}</b><small>${f.hostile ? 'замечен в ' + clock(-(f.T - f.t)) : 'отправлен в ' + clock(-f.sent)}</small></div></div>
    ${place(a, 'profile')}<div class="arr">${f.phase === 'back' ? '←' : '→'}</div>${place(b, M.icon)}
    <div class="st"><span>${f.hostile ? 'Летит на вас' : STATE[f.phase]}</span><i style="--p:${Math.round(frac(f) * 100)}%"></i></div>
    <div class="tm"><b>${tf(f.t)}</b><small>${when}</small></div>
    <div class="sh"><b>${nshort(shipCount(f))}</b>${f.ships.slice(0, 2).map(([k]) => `<img src="${SHIP(k)}">`).join('')}${f.ships.length > 2 ? `<small>+${f.ships.length - 2}</small>` : ''}</div>
    <div class="cg">${f.cargo ? f.cargo.map(([r, n]) => `<span><img src="${HICON(r)}">${nshort(n)}</span>`).join('') : '<span class="none">без груза</span>'}</div>
    <div class="ac">${acts}</div></div>`;
}
const hot = FLIGHTS.filter((f) => f.hostile).sort((x, y) => x.t - y.t);
const mine = FLIGHTS.filter((f) => !f.hostile).sort((x, y) => y.sent - x.sent);
const sel = FLIGHTS.find((f) => f.id === SEL0) || hot[0];
let html = `<div class="chips"><div class="ttl"><b>Рейсы и миссии</b><span>${FLIGHTS.length ? `${mine.length} ваших · флотов занято ${mine.length} из 16` : 'ни одного флота в пути'}</span></div>
  ${hot.length ? `<div class="chip red"><img src="${ICON('attack')}">Атак на вас <b>${hot.length}</b> · ближайшая <b>${tf(hot[0].t)}</b></div>` : ''}
  <div class="chip"><img src="${ICON('espionage')}">Шпионские отчёты</div><button class="btn pri">Отправить флот</button></div>`;
if (!FLIGHTS.length) html += `<div class="empty"><img src="${R}src/assets/ui/empty/empty-flights.webp"><b>Сейчас ни один флот не летит</b><span>Атаки на ваши планеты тоже появятся здесь, сверху и красным.</span><button class="btn pri">Отправить флот</button></div>`;
else {
  html += `<div class="list">${hot.length ? `<div class="sec red">Атаки на ваши планеты</div>${hot.map((f) => row(f, f === sel)).join('')}` : ''}
    <div class="sec">Ваши миссии · по времени отправки</div>${mine.map((f) => row(f, f === sel)).join('')}<div class="more">ещё ${Math.max(0, mine.length - 7)} ниже</div></div>`;
  const M = MISSION[sel.m];
  html += `<div class="ban" style="background-image:url('${BANNER(M.banner)}')"><div>
    <div><div class="k">${sel.hostile ? 'Атака на вашу планету' : 'Миссия'}</div><h2>${sel.hostile ? `${HOME[sel.home].name} · <em>${tf(sel.t)}</em>` : M.label}</h2>
      <p>${sel.hostile ? `Летит ${sel.from.name} [${sel.from.c}]` : ''}</p></div>
    <div class="stats"><span>Кораблей<b>${nshort(shipCount(sel))}</b></span><span>Типов<b>${sel.ships.length}</b></span><span>Удар в<b>${clock(sel.t)}</b></span></div>
    <div class="bt"><button class="btn">Позвать союз</button><button class="btn red">Увести флот</button></div></div></div>`;
}
document.getElementById('a').innerHTML = html;
</script><script src="../frame.js"></script>
</body></html>
