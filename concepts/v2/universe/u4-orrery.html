<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Вселенная · U4 · Орбитальная карта</title>
<link rel="stylesheet" href="../frame.css">
<style>
.area { background: radial-gradient(circle at 54% 52%, #071322 0%, #02050a 62%); overflow: hidden; }
svg { position: absolute; inset: 0; width: 1920px; height: 944px; }
.strip { position: absolute; left: 24px; top: 70px; bottom: 24px; width: 64px; display: flex; flex-direction: column; gap: 3px; }
.strip div { flex: 1; display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 6px; border-radius: 8px; padding: 0 6px; position: relative; }
.strip b { font-size: 11px; color: #5f6d82; font-weight: 700; text-align: right; }
.strip img { width: 26px; height: 26px; object-fit: contain; }
.strip i { width: 8px; height: 8px; border-radius: 50%; border: 1px dashed #3a4658; margin-left: 9px; }
.strip .sel { background: rgba(255,59,78,.16); box-shadow: inset 2px 0 0 #ff3b4e; }
.strip .sel b { color: #fff; }
.strip .bar { position: absolute; right: -5px; top: 30%; bottom: 30%; width: 3px; border-radius: 2px; background: var(--c); }
.pl { position: absolute; transform: translate(-50%, -50%); }
.pl img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 10px #000); }
.pl::after { content: ''; position: absolute; inset: -18%; border-radius: 50%; border: 2px solid var(--c); opacity: var(--o, .9); }
.pl.t-uninhabited::after, .pl.k-asteroid::after { display: none; }
.pl.t-range::after { border-style: dashed; }
.pl.sel::after { inset: -32%; box-shadow: 0 0 18px var(--c); }
.sun { position: absolute; width: 150px; height: 150px; transform: translate(-50%, -50%); }
.sun img { width: 100%; height: 100%; }
.card { position: absolute; right: 90px; top: 120px; width: 400px; display: grid; gap: 14px; }
.card .art { width: 260px; height: 260px; margin: 0 auto -10px; position: relative; }
.card .art img { width: 100%; height: 100%; object-fit: contain; }
.card .art::after { content: ''; position: absolute; inset: -6%; border-radius: 50%; border: 2px solid #ff3b4e; box-shadow: 0 0 30px rgba(255,59,78,.4); }
.card h2 { font-size: 22px; line-height: 1.2; text-align: center; font-weight: 800; }
.card .sub { text-align: center; font-size: 14px; color: #ff8f98; font-weight: 700; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
.facts img { width: 34px; height: 34px; margin: 0 auto 4px; object-fit: contain; }
.facts b { font-size: 15px; display: block; } .facts small { font-size: 11px; color: #7f8da1; }
.acts { display: flex; justify-content: center; gap: 14px; }
.acts img { width: 66px; height: 66px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px rgba(255,255,255,.14); }
.acts .main img { box-shadow: 0 0 0 2px #ff3b4e, 0 0 20px rgba(255,59,78,.5); }
.acts span { display: block; text-align: center; font-size: 12px; font-weight: 700; color: #cfd8e6; margin-top: 6px; }
.title { position: absolute; left: 110px; top: 22px; } .title small { display: block; font-size: 12px; letter-spacing: 3px; color: #7f8da1; font-weight: 700; } .title b { font-size: 22px; font-weight: 800; }
.scale { position: absolute; left: 110px; bottom: 26px; font-size: 12px; color: #5f6d82; letter-spacing: 2px; }
</style></head><body>
<div class="stage"><img class="hdr" src="../assets/game-header.png"><main class="area">
  <svg id="s" viewBox="0 0 1920 944"></svg>
  <div class="strip" id="strip"></div>
  <div class="title"><small>ГАЛАКТИКА 1</small><b>Система 03</b></div>
  <div class="scale">ПОЗИЦИЯ = ОРБИТА · 1 У СОЛНЦА, 24 НА КРАЮ</div>
</main></div>
<script src="data.js"></script>
<script>
const area = document.querySelector('.area');
const CX = 830, CY = 480, R0 = 120, DR = 14.4;
let svg = '';
for (let i = 0; i < 24; i++) { const r = R0 + i * DR; const o = SYSTEM[i]; const sel = o.pos === SELECTED.pos;
  svg += `<circle cx="${CX}" cy="${CY}" r="${r}" fill="none" stroke="${sel ? 'rgba(255,90,100,.55)' : o.kind === 'empty' ? 'rgba(90,130,180,.08)' : 'rgba(100,160,230,.18)'}" stroke-width="${sel ? 2 : 1}"/>`; }
svg += `<line x1="${CX}" y1="${CY - 470}" x2="${CX}" y2="${CY + 470}" stroke="rgba(100,160,230,.06)"/><line x1="${CX - 470}" y1="${CY}" x2="${CX + 470}" y2="${CY}" stroke="rgba(100,160,230,.06)"/>`;
document.getElementById('s').innerHTML = svg;
const sun = document.createElement('div'); sun.className = 'sun'; sun.style.left = CX + 'px'; sun.style.top = CY + 'px'; sun.innerHTML = `<img src="${ART.sun(2)}">`; area.appendChild(sun);
SYSTEM.forEach((o, i) => { if (!o.art) return; const r = R0 + i * DR; const a = (i * 137.508 + 30) * Math.PI / 180;
  const d = document.createElement('div'); const sz = o.kind === 'asteroid' ? 26 : o.tone === 'uninhabited' ? 30 : 44 * (o.pos === SELECTED.pos ? 1.3 : 1);
  d.className = `pl k-${o.kind} t-${o.tone} ${o.pos === SELECTED.pos ? 'sel' : ''}`; d.style.cssText = `left:${CX + Math.cos(a) * r}px;top:${CY + Math.sin(a) * r}px;width:${sz}px;height:${sz}px;--c:${TONE[o.tone].color};--o:${['neutral', 'protected'].includes(o.tone) ? .45 : .9}`;
  d.innerHTML = `<img src="${o.art}">`; area.appendChild(d); });
document.getElementById('strip').innerHTML = SYSTEM.map((o) => `<div class="${o.pos === SELECTED.pos ? 'sel' : ''}" style="--c:${o.art && !['uninhabited', 'asteroid'].includes(o.tone) ? TONE[o.tone].color : 'transparent'}"><b>${o.pos}</b>${o.art ? `<img src="${o.art}">` : '<i></i>'}<span class="bar"></span></div>`).join('');
const S = SELECTED;
if (S.tone !== 'empty') {
  const c = document.createElement('div'); c.className = 'card';
  c.innerHTML = `<div class="art"><img src="${S.planets[0].art}"></div><h2>${S.name}</h2><div class="sub">[${S.ally.tag}] · враг · в диапазоне</div>
    <div class="facts"><div><img src="${ART.score('overall-star')}"><b>${short(S.points[0].v)}</b><small>очки</small></div><div><img src="${ART.icon('debris')}"><b>${short(S.debris)}</b><small>обломки</small></div><div><img src="${ART.action('espionage')}" style="border-radius:50%"><b>14 мин</b><small>разведка</small></div></div>
    <div class="acts">${S.actions.filter((a) => !a.off).map((a) => `<div class="${a.main ? 'main' : ''}"><img src="${ART.action(a.k)}"><span>${a.time.slice(3)}</span></div>`).join('')}</div>`;
  area.appendChild(c);
}
</script><script src="../frame.js"></script>
</body></html>
