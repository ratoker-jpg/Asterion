<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Вселенная · B · Мостик</title>
<link rel="stylesheet" href="../base.css">
<style>
:root { --bg: #090b0f; --panel: #0f1218; --line: #1f252f; --dim: #7c8594; --amber: #ffb547; --ink: #e9edf3; }
body { background: var(--bg); }
main { display: grid; grid-template-columns: 17rem 1fr 26rem; gap: 0; }
.nav, .card { background: var(--panel); padding: 1rem; display: flex; flex-direction: column; gap: .8rem; min-height: 0; }
.nav { border-right: 1px solid var(--line); }
.card { border-left: 1px solid var(--line); }
.h { font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 700; display: flex; justify-content: space-between; }
.h b { color: var(--amber); letter-spacing: .04em; }
.gx { display: grid; grid-template-columns: repeat(5, 1fr); gap: .22rem; }
.sys { height: 2.7rem; border-radius: 2px; background: #141922; border: 1px solid #1b212b; padding: .2rem .25rem; display: grid; grid-template-rows: auto 1fr; position: relative; }
.sys b { font-size: .58rem; color: var(--dim); font-weight: 700; }
.sys.cur { border-color: var(--amber); background: #1d1a12; }
.sys.cur b { color: var(--amber); }
.bars { display: flex; gap: 1px; align-items: flex-end; height: 1.2rem; }
.bars i { width: .32rem; border-radius: 1px 1px 0 0; }
.sys .deb { position: absolute; right: .25rem; top: .25rem; width: .42rem; height: .42rem; transform: rotate(45deg); background: var(--amber); }
.sys .warn { position: absolute; right: .2rem; bottom: .15rem; font-size: .55rem; font-weight: 800; color: #ff8a3d; }
.quick { display: grid; gap: .35rem; }
.q { display: grid; grid-template-columns: 2.2rem 1fr auto; gap: .55rem; align-items: center; background: #141922; border: 1px solid #1b212b; border-radius: 2px; padding: .35rem .5rem; }
.q img { width: 2.2rem; height: 2.2rem; object-fit: cover; border-radius: 50%; }
.q b { font-size: .7rem; display: block; } .q small { font-size: .6rem; color: var(--dim); }
.q em { font-style: normal; font-size: .7rem; font-weight: 800; color: var(--amber); }
.legend { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: .25rem .6rem; font-size: .58rem; color: var(--dim); }
.legend span { display: flex; gap: .35rem; align-items: center; } .legend i { width: .5rem; height: .5rem; border-radius: 1px; }
.mid { display: grid; grid-template-rows: auto auto 1fr; min-height: 0; padding: .8rem 1rem .6rem; }
.title { display: flex; align-items: baseline; gap: 1rem; }
.title h1 { font-size: 1.1rem; font-weight: 800; letter-spacing: .02em; }
.title h1 span { color: var(--amber); }
.title p { font-size: .66rem; color: var(--dim); }
.title .nx { margin-left: auto; display: flex; gap: .3rem; }
.title .nx span { font-size: .66rem; padding: .3rem .6rem; border: 1px solid var(--line); border-radius: 2px; color: var(--ink); font-weight: 700; }
.thead, .row { display: grid; grid-template-columns: 1.6rem 1.8rem minmax(0, 1fr) 6.6rem 6.6rem 4.6rem 5.4rem; gap: .45rem; align-items: center; }
.thead { font-size: .56rem; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding: .7rem .4rem .3rem; border-bottom: 1px solid var(--line); }
.thead span:nth-child(n+4) { text-align: right; } .thead span:last-child { text-align: center; }
.rows { overflow: hidden; display: grid; grid-auto-rows: 1fr; }
.row { padding: 0 .4rem; border-bottom: 1px solid #141922; position: relative; min-height: 0; }
.row::before { content: ''; position: absolute; left: 0; top: 18%; bottom: 18%; width: 3px; background: var(--c); border-radius: 2px; }
.row.t-empty::before, .row.t-uninhabited::before { display: none; }
.row.sel { background: linear-gradient(90deg, rgba(255,181,71,.12), transparent 70%); }
.row .n { font-size: .66rem; color: var(--dim); font-weight: 700; text-align: right; }
.row img.a { width: 1.7rem; height: 1.7rem; object-fit: contain; }
.nm { min-width: 0; line-height: 1.15; }
.nm b { font-size: .66rem; font-weight: 700; display: block; white-space: nowrap; }
.nm small { font-size: .56rem; color: var(--dim); display: block; }
.nm small i { font-style: normal; color: var(--c); font-weight: 700; }
.row.t-empty .nm b, .row.t-uninhabited .nm b { color: #4b5463; font-weight: 600; }
.num { text-align: right; font-size: .66rem; font-weight: 700; white-space: nowrap; }
.num.dim { color: #3b4350; font-weight: 500; } .num.deb { color: var(--amber); } .num.gas { color: #7fe0c2; }
.acts { display: flex; gap: .25rem; justify-content: center; }
.acts img { width: 1.55rem; height: 1.55rem; border-radius: 50%; object-fit: cover; border: 1px solid #2a313d; }
.acts .off { opacity: .28; filter: grayscale(1); }
.acts img { width: 1.5rem; height: 1.5rem; }
.cell { display: none; }
@media (min-aspect-ratio: 2/1) {
  main { grid-template-columns: 22rem 1fr 34rem; }
  .thead, .row { grid-template-columns: 1.8rem 2rem minmax(0, 1.3fr) minmax(0, 1fr) 7.4rem 7.4rem 6.4rem 7rem 9.6rem; }
  .cell { display: block; font-size: .6rem; color: var(--dim); }
  .gx { grid-template-columns: repeat(8, 1fr); }
  .nm b { white-space: normal; }
  .nm small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
/* card */
.c-top { display: grid; grid-template-columns: 4.6rem 1fr; gap: .8rem; align-items: center; }
.c-top img { width: 4.6rem; height: 4.6rem; object-fit: contain; }
.chip { display: inline-block; font-size: .58rem; font-weight: 800; color: #fff; background: #5a1820; border: 1px solid #ff3b4e; padding: .15rem .4rem; border-radius: 2px; letter-spacing: .04em; }
.c-top h2 { font-size: .95rem; line-height: 1.2; margin: .3rem 0 .15rem; }
.c-top .co { font-size: .66rem; color: var(--amber); font-weight: 800; }
.own { display: grid; grid-template-columns: 2.2rem 1fr; gap: .55rem; background: #141922; padding: .5rem; border-radius: 2px; }
.own img { width: 2.2rem; height: 2.2rem; object-fit: contain; }
.own b { font-size: .68rem; display: block; } .own small { display: block; font-size: .6rem; color: var(--dim); line-height: 1.35; }
.own small i { font-style: normal; font-weight: 800; color: #ff6b78; }
.pts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.pts div { background: var(--panel); padding: .35rem .5rem; }
.pts small { font-size: .55rem; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; }
.pts b { display: block; font-size: .74rem; }
.spy { display: grid; grid-template-columns: auto 1fr; gap: .15rem .7rem; font-size: .62rem; color: var(--dim); }
.spy b { color: var(--ink); text-align: right; }
.spy .ago { grid-column: 1 / -1; color: #7fe0a0; font-weight: 800; font-size: .62rem; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: .35rem; }
.btn { display: grid; grid-template-columns: 2rem 1fr; gap: .45rem; align-items: center; padding: .35rem .45rem; border: 1px solid #2a313d; border-radius: 2px; background: #141922; }
.btn img { width: 2rem; height: 2rem; border-radius: 50%; object-fit: cover; }
.btn b { font-size: .68rem; display: block; } .btn small { font-size: .6rem; color: var(--amber); font-weight: 800; }
.btn.main { border-color: var(--amber); background: #251d10; }
.btn.off { opacity: .45; } .btn.off small { color: var(--dim); font-weight: 600; }
.pl { margin-top: auto; }
.prow { display: grid; grid-template-columns: 1.3rem 1fr auto; gap: .45rem; align-items: center; font-size: .6rem; padding: .14rem 0; border-bottom: 1px solid #161b23; }
.prow img { width: 1.3rem; height: 1.3rem; object-fit: contain; }
.prow span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow em { font-style: normal; color: var(--amber); font-weight: 800; }
.prow.here span { font-weight: 800; }
@media (min-aspect-ratio: 2/1) { .prow span { white-space: normal; } .btns { grid-template-columns: 1fr 1fr; } }
.empty-msg { font-size: .66rem; color: var(--dim); line-height: 1.5; }
</style></head>
<body>
<script src="../data.js"></script>
<script>
document.write(headerHTML());
const S = SELECTED;
const gx = SYSTEMS.map((s) => `<div class="sys ${s.n === CURRENT_SYSTEM ? 'cur' : ''}"><b>${String(s.n).padStart(2, '0')}</b>
  <div class="bars">${[['#5aa9ff', s.self], ['#4fd18b', s.ally], ['#ff3b4e', s.enemy], ['#ff8f98', s.range]].map(([c, v]) => `<i style="background:${c};height:${v ? 20 + v * 20 : 6}%;opacity:${v ? 1 : .25}"></i>`).join('')}</div>
  ${s.debris ? '<i class="deb"></i>' : ''}${s.sun === 'raid' ? '<i class="warn">!</i>' : ''}</div>`).join('');
const WORD = { self: 'вы', ally: 'союз', enemy: 'враг', range: 'цель', neutral: 'вне диапазона', protected: 'защита новичка', unique: 'уникальный объект', pirate: 'пиратская база', anomaly: 'аномалия', asteroid: 'астероид' };
const row = (o) => {
  const t = TONE[o.tone];
  const sub = o.kind === 'empty' ? 'свободно' : o.tone === 'uninhabited' ? 'можно колонизировать' :
    o.owner ? `<i>${o.ally ? `[${ALLIANCES[o.ally].tag}]` : WORD[o.tone]}</i> ${o.owner === o.name ? RACE[o.race] : o.owner}${o.shield ? ` · щит ${o.shield}` : ''}` :
    o.kind === 'asteroid' ? `<i>астероид</i> · сменит место через ${o.moves || '5 ч'}` : `<i>${WORD[o.tone]}</i>${o.timer ? ` · исчезнет через ${o.timer}` : ''}${o.occupant ? ' · занят чужим флотом' : ''}${o.mine ? ' · ' + o.mine : ''}`;
  const target = ['enemy', 'range'].includes(o.tone), own = ['self', 'ally'].includes(o.tone);
  const acts = o.kind === 'empty' || o.tone === 'uninhabited' ? ['colonize', 'recycle'] : o.kind === 'asteroid' ? ['gas', 'recycle'] : own ? ['transport', 'recycle'] : ['espionage', 'attack', 'recycle'];
  const offs = { attack: !target && o.kind === 'planet', recycle: !o.debris, colonize: true };
  return `<div class="row t-${o.tone} ${o.pos === S.pos ? 'sel' : ''}" style="--c:${t.color}">
    <span class="n">${o.pos}</span>${o.art ? `<img class="a" src="${o.art}">` : '<span></span>'}
    <div class="nm"><b>${o.name || 'Свободная позиция'}</b><small>${sub}</small></div>
    <span class="cell">${o.ally ? ALLIANCES[o.ally].name : o.spy ? '' : ''}</span>
    <span class="num ${o.points ? '' : 'dim'}">${o.points ? fmt(o.points) : '—'}</span>
    <span class="num ${o.debris ? 'deb' : 'dim'}">${o.debris ? fmt(o.debris) : '—'}</span>
    <span class="num ${o.gas ? 'gas' : 'dim'}">${o.gas ? fmt(o.gas) + '/ч' : '—'}</span>
    <span class="cell">${o.spy ? 'разведка ' + o.spy : ''}</span>
    <span class="acts">${acts.map((k) => `<img class="${offs[k] ? 'off' : ''}" src="${ART.action(k)}">`).join('')}</span></div>`;
};
const card = S.tone === 'empty' ? `<div class="c-top"><div style="width:4.6rem;height:4.6rem;border:1px dashed #2a313d;border-radius:50%"></div><div><span class="chip" style="background:#141922;border-color:#2a313d">Позиция ${S.pos}</span><h2>${S.name}</h2><div class="co">${S.coord}</div></div></div>
  <p class="empty-msg">${S.status}. Обломков нет. Переработчики можно отправить заранее.</p>
  <div class="btns">${S.actions.map((a) => `<div class="btn ${a.off ? 'off' : ''}"><img src="${ART.action(a.k)}"><span><b>${a.label}</b><small>${a.off || a.time}</small></span></div>`).join('')}</div>`
: `<div class="c-top"><img src="${S.planets[0].art}"><div><span class="chip">${S.status}</span><h2>${S.name}</h2><div class="co">${S.coord}</div></div></div>
  <div class="own"><img src="${ART.emblem(S.race)}"><div><b>${S.owner}</b><small>${RACE[S.race]} · ${S.online}</small><small><i>[${S.ally.tag}]</i> ${S.ally.name}</small></div></div>
  <div class="pts">${S.points.map((p) => `<div><small>${p.label}</small><b>${fmt(p.v)}</b></div>`).join('')}</div>
  <div class="spy"><span class="ago">Разведка ${S.spy.ago}</span><span>Металл</span><b>${fmt(S.spy.metal)}</b><span>Минералы</span><b>${fmt(S.spy.mineral)}</b><span>Газ</span><b>${fmt(S.spy.gas)}</b><span>Флот · оборона</span><b>${fmt(S.spy.fleet)} · ${fmt(S.spy.defence)}</b><span>Обломки</span><b style="color:var(--amber)">${fmt(S.debris)}</b></div>
  <div class="btns">${S.actions.map((a) => `<div class="btn ${a.main ? 'main' : ''} ${a.off ? 'off' : ''}"><img src="${ART.action(a.k)}"><span><b>${a.label}</b><small>${a.off || a.time}</small></span></div>`).join('')}</div>
  <div class="pl"><div class="h"><span>Планеты игрока</span><b>${S.planets.length} из 7</b></div>${S.planets.map((p) => `<div class="prow ${p.here ? 'here' : ''}"><img src="${p.art}"><span>${p.name}</span><em>${p.coord}</em></div>`).join('')}</div>`;
document.write(`<main>
  <aside class="nav">
    <div class="h"><span>Галактика 1</span><b>40 систем</b></div><div class="gx">${gx}</div>
    <div class="h"><span>Рядом с вами</span><b>до 5 систем</b></div>
    <div class="quick">${isEmpty ? '<p class="empty-msg">Рядом нет ни газа, ни обломков, ни целей.</p>' : `
      <div class="q"><img src="${ART.action('gas')}"><span><b>Газ</b><small>3 астероида · 57 330/ч</small></span><em>›</em></div>
      <div class="q"><img src="${ART.action('recycle')}"><span><b>Обломки</b><small>5 полей · 988 млрд</small></span><em>›</em></div>
      <div class="q"><img src="${ART.action('attack')}"><span><b>Цели</b><small>12 в диапазоне · 3 враги</small></span><em>›</em></div>`}
    </div>
    <div class="legend"><span><i style="background:#5aa9ff"></i>ваши</span><span><i style="background:#4fd18b"></i>союз</span><span><i style="background:#ff3b4e"></i>враж. союз</span><span><i style="background:#ff8f98"></i>в диапазоне</span><span><i style="background:var(--amber);transform:rotate(45deg)"></i>обломки</span><span style="color:#ff8a3d">! рейд на Солнце</span></div>
  </aside>
  <section class="mid">
    <div class="title"><h1>Система <span>${String(CURRENT_SYSTEM).padStart(2, '0')}</span></h1><p>Галактика 1 · Солнце 70% · ${isEmpty ? '3 из 24 занято' : '20 из 24 занято'}</p><div class="nx"><span>‹ 02</span><span>Домой</span><span>04 ›</span></div></div>
    <div class="thead"><span>№</span><span></span><span>Объект · владелец</span><span class="cell">Союз</span><span>Очки</span><span>Обломки</span><span>Газ</span><span class="cell">Разведка</span><span>Действия</span></div>
    <div class="rows">${SYSTEM.map(row).join('')}</div>
  </section>
  <aside class="card">${card}</aside>
</main>`);
</script>
</body></html>
