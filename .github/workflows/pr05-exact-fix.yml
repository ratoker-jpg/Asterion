name: PR05 Exact Fix

on:
  push:
    branches:
      - codex/pr05-spaceport-upgrades

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'PR05: apply exact TypeScript fixes'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr05-spaceport-upgrades
      - name: Apply exact fixes
        shell: pwsh
        run: |
          $appPath = 'src/App.tsx'
          $app = Get-Content $appPath -Raw
          $app = $app.Replace('CURRENT_SIENCE_LEVELS', 'CURRENT_SCIENCE_LEVELS')
          Set-Content -Path $appPath -Value $app -NoNewline

          $domainPath = 'src/domain/buildings/spaceport-upgrades.ts'
          $domain = Get-Content $domainPath -Raw
          $domain = $domain.Replace('const startedAt = previousFinishAt == null ? rawStartedAt : previousFinishAt;', 'const startedAt: number = previousFinishAt == null ? rawStartedAt : previousFinishAt;')
          $domain = $domain.Replace('const finishAt = rawFinishAt != null && rawFinishAt >= startedAt', 'const finishAt: number = rawFinishAt != null && rawFinishAt >= startedAt')
          Set-Content -Path $domainPath -Value $domain -NoNewline

          git diff --check
          git diff -- src/App.tsx src/domain/buildings/spaceport-upgrades.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/domain/buildings/spaceport-upgrades.ts
          if (git diff --cached --quiet) { throw 'Expected PR05 fixes were not applied.' }
          git commit -m 'PR05: apply exact TypeScript fixes'
          git push origin HEAD:codex/pr05-spaceport-upgrades
