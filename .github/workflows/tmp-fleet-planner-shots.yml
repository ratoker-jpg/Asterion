name: tmp fleet planner shots
on:
  push:
    branches: [claude/fleet-planner]
jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Layout mocks
        if: ${{ hashFiles('tools/tmp-mock/fleet-planner.html') != '' }}
        run: npx electron tools/tmp-mock/shoot.cjs
      - name: Build
        if: ${{ hashFiles('electron/fleet-planner-qa.cjs') != '' }}
        run: npm run build
      - name: Planner QA
        if: ${{ hashFiles('electron/fleet-planner-qa.cjs') != '' }}
        run: npx electron electron/fleet-planner-qa.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fleet-planner-shots
          path: visual-qa/fleet-planner/**/*
          retention-days: 7
