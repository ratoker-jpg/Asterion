name: tmp fleet redo shots
# Temporary: flight plan screenshots for claude/fleet-redo only. Removed before merge.
on:
  push:
    branches: ['claude/fleet-redo']
    paths-ignore: ['visual-qa/fleet-redo/**', 'changelog/**']

jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - shell: bash
        run: npx electron electron/fleet-redo-screenshots.cjs --dist=dist --only=plan --out=shots/after
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fleet-redo-shots
          path: shots/**/*
          retention-days: 7
