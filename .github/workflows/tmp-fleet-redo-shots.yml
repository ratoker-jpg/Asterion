name: tmp fleet redo shots
# Temporary: screenshots for claude/fleet-redo only. Removed before the PR is ready.
on:
  push:
    branches: ['claude/fleet-redo']
    paths-ignore: ['visual-qa/fleet-redo/before/**', 'visual-qa/fleet-redo/after/**', 'changelog/**']

jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Layout variants
        if: contains(github.event.head_commit.message, '[mocks]')
        shell: bash
        run: npx electron visual-qa/fleet-redo/mocks/render-mocks.cjs --out=shots/mocks
      - run: npm run build
        if: contains(github.event.head_commit.message, '[shots]') || contains(github.event.head_commit.message, '[before]')
      - name: After
        if: contains(github.event.head_commit.message, '[shots]')
        shell: bash
        run: npx electron electron/fleet-redo-screenshots.cjs --dist=dist --out=shots/after
      - name: Before (main)
        if: contains(github.event.head_commit.message, '[before]')
        shell: bash
        run: |
          git fetch --depth=1 origin main
          git worktree add --detach ../base FETCH_HEAD
          cmd //c "mklink /J ..\\base\\node_modules node_modules"
          (cd ../base && npm run build)
          npx electron electron/fleet-redo-screenshots.cjs --dist=../base/dist --before --out=shots/before
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fleet-redo-shots
          path: shots/**/*
          retention-days: 7
