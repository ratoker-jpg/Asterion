name: tmp atlas shots
# TEMPORARY: branch only, removed before merge.
on:
  push:
    branches: [claude/fleets-variant-a]
jobs:
  shoot:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron electron/tmp-atlas-shots.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: atlas-shots
          path: artifacts/atlas-shots
          retention-days: 7
