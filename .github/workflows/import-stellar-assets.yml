name: Import Stellar assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-stellar-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Asterion
        uses: actions/checkout@v4

      - name: Clone Stellar Empires assets
        run: |
          git clone --depth 1 https://github.com/ratoker-jpg/stellar-empires.git /tmp/stellar-empires
          rm -rf assets
          cp -a /tmp/stellar-empires/assets ./assets

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No asset changes to import."
            exit 0
          fi
          git commit -m "chore: import legacy Stellar assets"
          git push
