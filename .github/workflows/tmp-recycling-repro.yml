name: tmp recycling tick race repro
on:
  push:
    branches: [claude/recycling-center-redo]
jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron electron/command-tick-race-qa.cjs
