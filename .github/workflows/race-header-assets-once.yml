name: One-time faction header asset import

on:
  push:
    branches:
      - codex/race-header-reference-rebuild

permissions:
  contents: write

jobs:
  integrate-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download and prepare faction header assets
