                  'task': 'e41e8be3-85cb-424f-a717-4028bf719706', 'fallback': False, 'max_width': 1024,
              },
              'veyra/campaign_utility.png': {
                  'url': 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/213558fa-c788-42f6-9270-36237449d23a/031ebaae-4200-4c3b-a6fd-00545138c08b/Single_standalone_campaign_status_and_utility_HUD_module_for.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTM5MTI3OTQ4NWMyOGQyYiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTA0NzA2MH0.ZN81jOwTcxCXKEx7ZxgTQ3cpzx1nId7wfBD-0DC1d30',
                  'task': '213558fa-c788-42f6-9270-36237449d23a', 'fallback': True, 'max_width': 800,
              },
