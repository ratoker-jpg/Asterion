          def download(url: str) -> bytes:
              request = urllib.request.Request(url, headers={'User-Agent': 'Asterion-asset-import/1.0'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read()
              if len(data) < 1000:
                  raise RuntimeError(f'downloaded asset is unexpectedly small: {len(data)} bytes')
              return data

          def connected_black_to_alpha(image: Image.Image, threshold: int = 30) -> Image.Image:
              image = image.convert('RGBA')
              pixels = image.load()
              width, height = image.size
              background = bytearray(width * height)
              queue: deque[tuple[int, int]] = deque()

              def dark(x: int, y: int) -> bool:
                  r, g, b, a = pixels[x, y]
                  return a > 0 and max(r, g, b) <= threshold

              def seed(x: int, y: int) -> None:
                  idx = y * width + x
                  if not background[idx] and dark(x, y):
                      background[idx] = 1
                      queue.append((x, y))

              for x in range(width):
                  seed(x, 0)
                  seed(x, height - 1)
              for y in range(height):
                  seed(0, y)
                  seed(width - 1, y)

              while queue:
                  x, y = queue.popleft()
                  for nx, ny in ((x - 1, y), (x + 1, y), (x, y - 1), (x, y + 1)):
                      if 0 <= nx < width and 0 <= ny < height:
                          idx = ny * width + nx
                          if not background[idx] and dark(nx, ny):
                              background[idx] = 1
                              queue.append((nx, ny))

              mask = Image.new('L', (width, height), 0)
              mask_pixels = mask.load()
              for y in range(height):
                  row = y * width
                  for x in range(width):
                      if background[row + x]:
                          mask_pixels[x, y] = 255
                          r, g, b, _ = pixels[x, y]
                          pixels[x, y] = (r, g, b, 0)

              # Feather only the immediate exterior edge; enclosed dark panel interiors remain opaque.
              dilated = mask.filter(ImageFilter.MaxFilter(5))
              dilated_pixels = dilated.load()
              for y in range(height):
                  row = y * width
                  for x in range(width):
                      if background[row + x] or dilated_pixels[x, y] == 0:
                          continue
                      r, g, b, a = pixels[x, y]
                      peak = max(r, g, b)
                      if peak < 68:
                          feather = max(0, min(255, int((peak - threshold) * 255 / max(1, 68 - threshold))))
                          pixels[x, y] = (r, g, b, min(a, feather))
              return image

          def alpha_fraction(image: Image.Image) -> float:
              alpha = image.getchannel('A')
              histogram = alpha.histogram()
              transparent = sum(histogram[:250])
              return transparent / (image.width * image.height)

          def crop_and_pad(image: Image.Image, pad: int = 8) -> Image.Image:
              bbox = image.getchannel('A').getbbox()
              if bbox is None:
                  raise RuntimeError('asset is fully transparent')
              left, top, right, bottom = bbox
              left = max(0, left - pad)
              top = max(0, top - pad)
              right = min(image.width, right + pad)
              bottom = min(image.height, bottom + pad)
              return image.crop((left, top, right, bottom))

          def scrub_selector_glyph(image: Image.Image) -> Image.Image:
              # Generated selector art occasionally invents a dropdown glyph even though the live DOM owns it.
              # Remove only bright accent pixels in the small interior where that glyph appears; keep the frame.
              image = image.copy().convert('RGBA')
              px = image.load()
              w, h = image.size
              x0, x1 = int(w * 0.865), int(w * 0.925)
              y0, y1 = int(h * 0.34), int(h * 0.66)
              sample = []
              sx0, sx1 = int(w * 0.73), int(w * 0.80)
              sy0, sy1 = int(h * 0.42), int(h * 0.58)
              for y in range(sy0, sy1):
                  for x in range(sx0, sx1):
                      r, g, b, a = px[x, y]
                      if a > 220 and max(r, g, b) < 90:
                          sample.append((r, g, b))
              if sample:
                  fill = tuple(int(median([c[i] for c in sample])) for i in range(3))
              else:
                  fill = (6, 16, 24)
              for y in range(y0, y1):
                  for x in range(x0, x1):
                      r, g, b, a = px[x, y]
                      if a == 0:
                          continue
                      peak = max(r, g, b)
                      trough = min(r, g, b)
                      if peak > 82 and peak - trough > 22:
                          px[x, y] = (*fill, a)
              return image

          metadata = {}
          for relative, spec in ASSETS.items():
              raw = download(spec['url'])
              image = Image.open(io.BytesIO(raw)).convert('RGBA')
              if spec['fallback'] or alpha_fraction(image) < 0.03:
                  image = connected_black_to_alpha(image)
              image = crop_and_pad(image)
              if relative.endswith('planet_selector.png'):
                  image = scrub_selector_glyph(image)
              max_width = int(spec['max_width'])
              if image.width > max_width:
                  target_height = max(1, round(image.height * max_width / image.width))
                  image = image.resize((max_width, target_height), Image.Resampling.LANCZOS)
              output = ROOT / relative
              output.parent.mkdir(parents=True, exist_ok=True)
              image.save(output, 'PNG', optimize=True, compress_level=9)
              digest = hashlib.sha256(output.read_bytes()).hexdigest()
              metadata[relative] = {
                  'task': spec['task'],
                  'fallback_black_key': bool(spec['fallback']),
                  'width': image.width,
                  'height': image.height,
                  'alpha_fraction': round(alpha_fraction(image), 4),
                  'bytes': output.stat().st_size,
                  'sha256': digest,
              }
              print(relative, metadata[relative])

          (ROOT / 'ASSET_METADATA.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          python /tmp/integrate_header_assets.py
      - name: Verify generated files
        shell: bash
        run: |
          test -f assets/source/faction-header-v2/aegis/planet_selector.png
          test -f assets/source/faction-header-v2/aegis/resource_cell.png
          test -f assets/source/faction-header-v2/aegis/campaign_utility.png
          test -f assets/source/faction-header-v2/aegis/navigation_active.png
          test -f assets/source/faction-header-v2/synod/planet_frame.png
          test -f assets/source/faction-header-v2/synod/navigation_rail.png
          test -f assets/source/faction-header-v2/synod/planet_selector.png
          test -f assets/source/faction-header-v2/synod/campaign_utility.png
          test -f assets/source/faction-header-v2/veyra/planet_frame.png
          test -f assets/source/faction-header-v2/veyra/navigation_rail.png
          test -f assets/source/faction-header-v2/veyra/planet_selector.png
          test -f assets/source/faction-header-v2/veyra/campaign_utility.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for path in sorted(Path('assets/source/faction-header-v2').glob('*/*.png')):
              with Image.open(path) as image:
                  if image.mode != 'RGBA':
                      raise SystemExit(f'{path}: expected RGBA, got {image.mode}')
                  extrema = image.getchannel('A').getextrema()
                  if extrema[0] != 0 or extrema[1] != 255:
                      raise SystemExit(f'{path}: alpha channel is not full-range: {extrema}')
                  print(path, image.size, extrema)
          PY
      - name: Commit imported binary assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/source/faction-header-v2
          git rm .github/workflows/race-header-assets-once.yml
          git commit -m 'feat(ui): import faction header binary assets'
          git push origin HEAD:codex/race-header-reference-rebuild
