name: tmp simulator shots
on:
  push:
    branches: [claude/simulator-redo]
jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Screenshots
        run: npx electron electron/simulator-redo-screenshots.cjs
      - name: Old build for before shots
        if: always()
        shell: bash
        run: |
          git fetch --depth=1 origin 934aabc
          git worktree add ../old 934aabc
          cd ../old && npm ci --no-audit --no-fund && npx vite build
      - name: Before shots
        if: always()
        run: npx electron electron/simulator-redo-screenshots.cjs --before --dist=../old/dist
      - name: Simulator QA
        if: always()
        shell: bash
        run: ASTERION_SKIP_SCREENSHOTS=1 npm run test:simulator-ui 2>&1 | tail -c 6000
      - name: Battle report QA
        if: always()
        shell: bash
        run: ASTERION_SKIP_SCREENSHOTS=1 npm run test:battle-reports-ui 2>&1 | tail -c 4000
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: simulator-shots
          path: visual-qa/simulator-redo/**/*
          retention-days: 7
