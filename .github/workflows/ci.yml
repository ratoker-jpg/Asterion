name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Resource building domain tests
        run: npm run test:buildings
      - name: Combat domain tests
        run: npm run test:combat
      - name: Operations domain tests
        run: npm run test:operations
      - name: Command domain tests
        run: npm run test:command
      - name: Reports domain tests
        run: npm run test:reports
      - name: Settings domain tests
        run: npm run test:settings
      - name: Rating domain tests
        run: npm run test:rating
      - name: Science domain tests
        run: npm run test:science
      - name: Runtime mode domain tests
        run: npm run test:runtime
      - name: Fleet domain tests
        run: npm run test:fleet
      - name: Build renderer
        run: npm run build
      - name: Test Mode Electron QA
        env:
          # GitHub's hidden Windows compositor can block viewport captures on
          # long pages. Functional DOM/queue assertions still run; local QA
          # retains screenshots by leaving this unset.
          ASTERION_SKIP_SCREENSHOTS: '1'
        run: npm run test:test-mode-ui
      - name: Capture utility and resource-zone visual QA
        run: npm run qa:visual
      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Asterion-Utility-Visual-QA
          path: |
            visual-qa/**/*
            artifacts-pass1/test-mode-qa/**/*
          if-no-files-found: warn
          retention-days: 14
      - name: Package Windows app
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: Asterion-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
