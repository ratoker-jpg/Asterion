name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Combat domain tests
        run: npm run test:combat
      - name: Operations domain tests
        run: npm run test:operations
      - name: Command domain tests
        run: npm run test:command
      - name: Build renderer
        run: npm run build
      - name: Package Windows app
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: Asterion-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
