name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Combat domain tests
        run: npm run test:combat
      - name: Operations domain tests
        run: npm run test:operations
      - name: Command domain tests
        run: npm run test:command
      - name: Reports domain tests
        run: npm run test:reports
      - name: Settings domain tests
        run: npm run test:settings
      - name: Rating domain tests
        run: npm run test:rating
      - name: Science domain tests
        run: npm run test:science
      - name: Build renderer
        run: npm run build
      - name: Capture utility-screen visual QA
        run: npm run qa:visual
      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Asterion-Utility-Visual-QA
          path: visual-qa/**/*
          if-no-files-found: warn
          retention-days: 14
      - name: Package Windows app
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: Asterion-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
