name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The full-world catch-up measurement runs on demand and nightly, not on
  # every PR push (it holds a runner for about 15 minutes and gates nothing).
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs run in parallel on separate Windows runners: logical tests, NPC
# replay tests, balanced Electron QA shards and the installer. Wall time is the slowest job
# instead of the sum of every step.
jobs:
  logic:
    name: Logical tests and evidence
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test inventory (every *.test.ts runs in exactly one CI suite)
        run: npm run test:inventory
      - name: Asterion asset audit
        run: npm run assets:asterion:audit
      - name: Resource building domain tests
        run: npm run test:buildings
      - name: Combat domain tests
        run: npm run test:combat
      - name: Pirate domain tests
        run: npm run test:pirates
      - name: Pirate operations integration tests
        run: npm run test:pirate-operations
      - name: PR91 seeded battle and net-economics evidence
        run: npm run balance:pirates:pr91
      - name: PR91 approved matched-seed 3m-3.5m combat and net comparison
        run: npm run balance:pirates:pr91:approved
      - name: PR91 75-90 vs 85-105 garrison paired combat and net economics
        run: npm run balance:pirates:pr91:garrison
      - name: PR91 adaptive C seeded combat and optimistic net evidence
        run: npm run balance:pirates:pr91:adaptive
      - name: Existing attack compatibility suite
        run: npm run test:attack
      - name: Existing flight persistence suite
        run: npm run test:flights
      - name: Operations domain tests
        run: npm run test:operations
      - name: PR92 exploration domain tests
        run: npm run test:exploration
      - name: Command domain tests
        run: npm run test:command
      - name: Reports domain tests
        run: npm run test:reports
      - name: Settings domain tests
        run: npm run test:settings
      - name: Rating domain tests
        run: npm run test:rating
      - name: Science domain tests
        run: npm run test:science
      - name: Universe interaction domain tests
        run: npm run test:universe
      - name: Runtime mode domain tests
        run: npm run test:runtime
      - name: Fleet domain tests
        run: npm run test:fleet
      - name: Application integration tests
        run: npm run test:application
      - name: Espionage tests
        run: npm run test:espionage
      - name: Repair tests
        run: npm run test:repair
      - name: Resource domain tests
        run: npm run test:resources
      - name: Energy domain tests
        run: npm run test:energy
      - name: Sun raid tests
        run: npm run test:sun-raid
      - name: New game and save slot tests
        run: npm run test:new-game
      - name: Type-check and build renderer
        run: npm run build
      - name: Upload balance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Asterion-Balance-Evidence
          path: |
            artifacts/pr91-balance/**/*
            artifacts/pr91-approved-tech-compare/**/*
            artifacts/pr91-garrison-85-105/**/*
            artifacts/pr91-adaptive-c/**/*
          if-no-files-found: warn
          retention-days: 14

  # The NPC replay suite runs multi-day catch-ups (up to 7 game days on pull
  # requests; 30-day horizons run in the long-horizon job), so it has its own
  # runner instead of lengthening the logical job.
  npc:
    name: NPC replay tests
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: NPC foundation contracts and persistence
        run: npm run test:npc

  electron:
    name: Electron QA (${{ matrix.shard }})
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout-minutes || 25 }}
    strategy:
      fail-fast: false
      # Shards are balanced by measured CI step times (about 4-6 minutes each, 27.10.2026).
      # Entry format: npm-script[:skip] where :skip sets ASTERION_SKIP_SCREENSHOTS=1
      # (GitHub's hidden Windows compositor can block captures on long pages).
      matrix:
        include:
          - shard: visual
            suites: "qa:visual test:test-mode-ui:skip test:header-ui test:resource-assets-ui test:save-safety-ui:skip test:save-store-ui"
          - shard: science-reports
            suites: "test:science-ui:skip test:building-actions-ui test:reports-ui test:battle-reports-ui:skip test:simulator-ui:skip test:space-flight-ui:skip test:production-test-isolation-ui:skip"
          # Owner decision (25.10.2026): a long absence is caught up in full
          # behind a progress bar and the player waits; there is no 14-day /
          # 120 s limit any more. The scoped replay QA checks the progress
          # banner, the pending-command gate, completion and state consistency.
          # Long-horizon durations are measured by the npc-full-world job.
          - shard: campaign-command
            suites: "test:new-game-ui:skip test:command-ui:skip test:command-aid-ui:skip test:command-journal-ui:skip"
          # The PR gate replays six game hours: the banner, command gate,
          # completion and state checks need no full day, which took about
          # 14 minutes. Whole days run in the long-horizon job (main and nightly).
          # The test fails on a stalled replay cursor, not on duration.
          # Pirate operations (about 1.5 minutes) ride along with the short replay.
          # Frame pacing (CPU rendering, fresh full world): a loose p95 budget
          # catches a screen that blocks the UI thread every second again.
          - shard: npc-replay
            suites: "test:npc-replay-ui-6h test:pirate-operations-ui test:late-game-fps-ui:skip"
          - shard: fleet-universe
            suites: "test:fleet-ui:skip test:universe-ui:skip test:energy-ui:skip test:repair-ui:skip"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build renderer
        run: npm run build
      - name: Run Electron QA suites
        shell: bash
        run: |
          for entry in ${{ matrix.suites }}; do
            script="${entry%:skip}"
            echo "::group::$script"
            if [ "$entry" != "$script" ]; then export ASTERION_SKIP_SCREENSHOTS=1; else unset ASTERION_SKIP_SCREENSHOTS; fi
            npm run "$script" || { echo "::endgroup::"; echo "::error::$script failed"; exit 1; }
            echo "::endgroup::"
          done
      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Asterion-QA-${{ matrix.shard }}
          path: |
            visual-qa/**/*
            artifacts-pass1/science-qa/**/*
            artifacts-pass1/resource-assets-qa/**/*
            artifacts-pass1/test-mode-qa/**/*
            artifacts/battle-report-qa/**/*
            artifacts/universe-planet-qa/**/*
            artifacts/pirate-operations-qa/**/*
            artifacts/save-safety-qa/**/*
            artifacts/npc-replay-qa*/**/*
          if-no-files-found: warn
          retention-days: 14

  # 30-day NPC replay horizons and the one-day Electron catch-up hold a runner
  # for about 25 minutes, so pull requests run 1-7 day horizons and six game
  # hours; this job runs the long ones on every push to main and nightly.
  long-horizon:
    name: NPC long-horizon checks (30 days, 1-day catch-up)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: NPC tests with 30-day horizons
        env:
          ASTERION_NPC_LONG_HORIZON: '1'
        run: npm run test:npc
      - name: Build renderer
        run: npm run build
      - name: Electron NPC catch-up (1 game day)
        run: npm run test:npc-replay-ui-1d
      - name: Upload catch-up QA artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Asterion-QA-npc-long-horizon
          path: artifacts/npc-replay-qa*/**/*
          if-no-files-found: warn
          retention-days: 14

  # Full campaign catch-up: 10 galaxies, 100 NPC with asteroid, exploration
  # and pirate timelines (no isolation). Owner decision (25.10.2026): a long
  # absence is replayed in full behind a progress bar, so this job measures
  # how long a catch-up takes instead of gating a duration. One full-world day
  # costs about 20 minutes of CPU today, so it measures six game hours in Node
  # and one game day in Electron. Shared runner speed varies, hence it reports
  # without gating the PR.
  npc-full-world:
    name: NPC full-world catch-up (measurement)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Node full-world benchmark (6 game hours)
        shell: bash
        run: |
          mkdir -p artifacts/npc-full-world
          npm run --silent benchmark:npc-full-world -- 0.25 > artifacts/npc-full-world/benchmark.json
      - name: Build renderer
        run: npm run build
      - name: Electron full-world QA (1 game day, progress banner)
        env:
          ASTERION_QA_CATCHUP_TIMEOUT_MS: '3000000'
          ASTERION_QA_CATCHUP_STALL_MS: '600000'
        run: npm run test:npc-replay-full-world-ui -- --days=1
      - name: Upload full-world results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Asterion-NPC-full-world
          path: |
            artifacts/npc-full-world*/**/*
            artifacts/npc-replay-full-world-qa*/**/*
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Windows installer
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Package Windows app
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: Asterion-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
