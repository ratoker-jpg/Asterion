name: TEMP Target Priority Audit

on:
  pull_request:

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            docs/evidence/nemexia-target-priority-corpus
            tools/audit-nemexia-target-priority-scope.mjs
            src/domain/combat
            assets/source/New assets
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run full non-core scope diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path audit-output | Out-Null
          $source = Get-Content tools/audit-nemexia-target-priority-scope.mjs -Raw
          $source = $source.Replace('if (examples.length < 30) {', 'if (true) {')
          Set-Content -Path tools/audit-nemexia-target-priority-scope-all.mjs -Value $source -Encoding utf8
          node --experimental-strip-types --experimental-loader ./src/domain/combat/test-asset-loader.mjs tools/audit-nemexia-target-priority-scope-all.mjs | Out-File -FilePath audit-output/scope-all.json -Encoding utf8
      - name: Upload audit artifact
        uses: actions/upload-artifact@v6
        with:
          name: Target-Priority-Noncore-Rows
          path: audit-output/scope-all.json
          if-no-files-found: error
          retention-days: 1
