name: TEMP Target Priority Audit

on:
  pull_request:

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            docs/evidence/nemexia-target-priority-corpus/target-transitions.csv
      - name: Capture commander-pair transitions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path audit-output | Out-Null
          $ids = @('22','24','57','59','2145','5865','5880')
          Import-Csv docs/evidence/nemexia-target-priority-corpus/target-transitions.csv |
            Where-Object { $ids -contains $_.transition_id } |
            ConvertTo-Json -Depth 20 |
            Out-File -FilePath audit-output/commander-pairs.json -Encoding utf8
      - name: Upload audit artifact
        uses: actions/upload-artifact@v6
        with:
          name: Target-Priority-Commander-Pairs
          path: audit-output/commander-pairs.json
          if-no-files-found: error
          retention-days: 1
