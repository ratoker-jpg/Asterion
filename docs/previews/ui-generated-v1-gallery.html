<!doctype html>
<meta charset="utf-8">
<title>Asterion UI Generated v1 gallery</title>
<style>
  :root { color-scheme: dark; font: 14px/1.4 system-ui, sans-serif; }
  body { margin: 24px; background: #0b0f18; color: #e8eef7; }
  h1 { margin-bottom: 4px; }
  p { color: #9eacc2; }
  section { margin: 28px 0 36px; }
  h2 { text-transform: capitalize; letter-spacing: .08em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  figure { margin: 0; padding: 10px; border: 1px solid #263247; border-radius: 8px; background: #111827; }
  figure img { display: block; width: 100%; height: 112px; object-fit: contain; image-rendering: auto; background-color: #0c111b; background-image: linear-gradient(45deg,#172033 25%,transparent 25%),linear-gradient(-45deg,#172033 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#172033 75%),linear-gradient(-45deg,transparent 75%,#172033 75%); background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0; }
  figcaption { margin-top: 8px; color: #c7d2e5; font-size: 12px; }
</style>
<h1>Asterion UI Generated v1</h1>
<p>54 transparent, text-free faction UI source assets. Open this file from the repository root or a local static server.</p>
<div id="gallery"></div>
<script>
const factions = ["aegis", "synod", "veyra"];
const assets = [
  "panel_frame_large", "panel_frame_medium", "panel_frame_small", "modal_frame", "tooltip_frame",
  "tab_idle", "tab_active", "button_primary_idle", "button_primary_hover", "button_primary_pressed",
  "button_secondary_idle", "button_secondary_hover", "button_secondary_pressed", "queue_slot_empty",
  "queue_slot_busy", "queue_slot_locked", "resource_chip", "selection_ring"
];
document.querySelector("#gallery").innerHTML = factions.map(faction => `
  <section><h2>${faction}</h2><div class="grid">${assets.map(asset => `
    <figure><img src="../../assets/source/ui-generated-v1/${faction}/${asset}.png" alt="${faction} ${asset}"><figcaption>${asset}</figcaption></figure>
  `).join("")}</div></section>
`).join("");
</script>
