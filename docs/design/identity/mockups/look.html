<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Облик · кастомизация</title>
<link rel="stylesheet" href="ui.css">
<style>
.main { left: 326px; right: 38px; display: flex; flex-direction: column; overflow: hidden; }
.tabs { display: flex; align-items: center; gap: 6px; padding: 18px 26px 14px; border-bottom: 1px solid var(--line); }
.tab { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; color: #aab5c5; padding: 10px 16px; border-radius: 10px; }
.tab img { width: 30px; height: 30px; object-fit: contain; }
.tab.on { color: #fff; background: rgba(86,217,242,.12); box-shadow: inset 0 0 0 1px rgba(86,217,242,.45); }
.tabs .pts { margin-left: auto; text-align: right; } .tabs .pts b { font-size: 22px; font-weight: 800; color: var(--g); } .tabs .pts span { display: block; font-size: 13px; color: var(--dim); }
.body { flex: 1; display: grid; grid-template-columns: 430px 1fr; min-height: 0; }
.prev { border-right: 1px solid var(--line); padding: 24px 26px; display: flex; flex-direction: column; gap: 14px; }
.prev .big { position: relative; height: 300px; display: grid; place-items: center; border-radius: 14px; background: radial-gradient(circle at 50% 50%, rgba(86,217,242,.08), transparent 65%); }
.prev .big img { width: 270px; height: 270px; object-fit: contain; position: relative; }
.prev .big.win::before { content: ''; position: absolute; width: 330px; height: 330px; border-radius: 50%; background: radial-gradient(circle, transparent 50%, rgba(255,210,110,.5) 57%, transparent 70%); }
.prev h3 { font-size: 26px; font-weight: 800; } .prev p { font-size: 15px; color: #b8c3d3; line-height: 1.45; }
.prev .who { display: flex; flex-direction: column; gap: 8px; }
.prev .f { display: flex; justify-content: space-between; font-size: 15px; padding: 10px 14px; } .prev .f span { color: var(--dim); }
.prev .acts { margin-top: auto; display: flex; gap: 10px; } .prev .acts .btn { flex: 1; }
.grid { padding: 10px 26px 20px; overflow: hidden; position: relative; }
.sec { display: flex; align-items: baseline; gap: 12px; padding: 14px 4px 10px; } .sec b { font-size: 15px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: #c7d1de; } .sec span { font-size: 14px; color: var(--dim); }
.tiles { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
.t { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px 10px; border-radius: 13px; background: rgba(16,26,31,.6); text-align: center; }
.t .pic { position: relative; width: 104px; height: 104px; display: grid; place-items: center; } .t .pic img { width: 100%; height: 100%; object-fit: contain; position: relative; }
.t b { font-size: 14px; font-weight: 800; } .t small { font-size: 13px; color: var(--dim); font-weight: 700; }
.t.off .pic img { filter: grayscale(.85) brightness(.5); } .t.off b { color: #8d99ab; }
.t.on { background: rgba(86,217,242,.12); box-shadow: inset 0 0 0 1px rgba(86,217,242,.5); }
.t.worn::after { content: 'на Helion 01'; position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 800; color: #04121b; background: var(--cyan); border-radius: 6px; padding: 2px 6px; }
.t.win .pic::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; background: radial-gradient(circle, transparent 52%, rgba(255,210,110,.55) 59%, transparent 72%); }
.t .lock { font-size: 12px; }
.t .lock.ok { color: var(--green); } .t .lock.ok::before { display: none; }
.t .lock.lead { color: var(--cyan); }
/* флагманы */
.ships { display: flex; flex-direction: column; gap: 14px; }
.srow { display: grid; grid-template-columns: 180px repeat(3, 1fr); gap: 12px; align-items: stretch; }
.srow .nm { display: flex; flex-direction: column; justify-content: center; padding: 0 6px; } .srow .nm b { font-size: 20px; font-weight: 800; } .srow .nm span { font-size: 14px; color: var(--dim); }
.sv { position: relative; border-radius: 13px; background: rgba(16,26,31,.6); padding: 10px 14px; display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: center; }
.sv img { width: 150px; height: 96px; object-fit: contain; } .sv b { font-size: 15px; display: block; } .sv small { font-size: 13px; color: var(--dim); display: block; margin-top: 3px; }
.sv.off img { filter: brightness(.35) blur(1.5px); } 
.sv.on { background: rgba(86,217,242,.12); box-shadow: inset 0 0 0 1px rgba(86,217,242,.5); }
.cmds { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
.cm { border-radius: 13px; background: rgba(16,26,31,.6); padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.cm img { width: 120px; height: 70px; object-fit: contain; } .cm b { font-size: 14px; } .cm small { font-size: 12px; color: var(--dim); }
.dots { display: flex; gap: 5px; } .dots i { width: 9px; height: 9px; border-radius: 50%; background: #2a3846; } .dots i.on { background: var(--cyan); } .dots i.got { background: #6f8aa0; }
.note { font-size: 14px; color: var(--dim); padding: 6px 4px 0; } .note b { color: #ffb3ba; }
</style></head><body>
<div class="stage"><img class="hdr" src="assets/header-messages.webp"><main class="area" id="a"></main></div>
<script src="../catalog.js"></script><script src="ui.js"></script><script src="progress.js"></script>
<script>
const { nav, fmt, A, crest } = UI;
const tab = UI.q.get('tab') || 'planets';
const pts = PROG.points;
const TABS = [['planets', 'Планеты', A.head('planet')], ['crest', 'Личный герб', A.head('command')], ['portrait', 'Портрет', A.report('profile')],
  ['commanders', 'Командиры', A.head('operations')], ['flagship', 'Флагманы', A.head('fleets')], ['card', 'Карточка', A.score('achievement-trophy')]];
const tabs = `<div class="tabs">${TABS.map(([id, n, ic]) => `<div class="tab ${id === tab || (tab === 'flagship' && id === 'flagship') ? 'on' : ''}"><img src="${ic}">${n}</div>`).join('')}
  <div class="pts"><b>${fmt(pts)}</b><span>очков летописи · ранг «Командор»</span></div></div>`;
const st = (n) => A.starter(n), sk = (n) => A.skin(n);
// [картинка, имя, статус]; статус: ok | число (порог) | 'ach:Имя' | 'lead' | 'win1' ...
const tile = ([pic, name, status, extra = '']) => {
  const open = status === 'ok' || (typeof status === 'number' && status <= pts) || status === 'win1' || status === 'lead';
  const label = status === 'ok' ? '' : typeof status === 'number' ? (status <= pts ? `<span class="lock ok">открыт · ${fmt(status)}</span>` : `<span class="lock">${fmt(status)} очков</span>`)
    : status.startsWith('ach:') ? `<span class="lock">за «${status.slice(4)}»</span>` : status === 'lead' ? '<span class="lock lead">глава союза</span>' : status === 'win1' ? '<span class="lock ok">победа в раунде</span>' : `<span class="lock">${status}</span>`;
  return `<div class="t ${open ? '' : 'off'} ${extra}"><div class="pic"><img src="${pic}"></div><b>${name}</b>${label || '<small>открыт</small>'}</div>`;
};
let body = '';
if (tab === 'planets') {
  const common = [[st('terran'), 'Терран', 'ok'], [st('oceanic'), 'Океан', 'ok', 'worn'], [st('desert'), 'Пустыня', 'ok'], [st('ice'), 'Ледяная', 'ok'], [st('volcanic'), 'Вулкан', 'ok'], [st('toxic'), 'Токсичная', 'ok'], [sk('skin-asterion-07'), 'Терра Прима', 'ok'], [sk('skin-asterion-06'), 'Дюны', 'ok']];
  const rare = [[sk('002'), 'Кольца', 250], [sk('005'), 'Шрам', 500], [sk('015'), 'Аметист', 800], [sk('027'), 'Сфера', 800], [sk('028'), 'Вихрь', 1200], [sk('030'), 'Осколок', 1200], [sk('032'), 'Механизм', 1800], [sk('021'), 'Пустотная', 2600]];
  const legend = [[sk('026'), 'Венец победителя', 'win1', 'win on'], [sk('skin-asterion-01'), 'Двойная корона', 'победа ×2', 'win'], [sk('skin-asterion-02'), 'Династия', 'победа ×3', 'win'], [sk('skin-asterion-03'), 'Трон Врат', 'lead', 'win'],
    [sk('011'), 'Пепел миров', 'ach:Пять руин'], [sk('012'), 'Вечная', 'ach:Старожил'], [sk('013'), 'Кристальная', 'ach:Хранитель кристаллов'], [sk('016'), 'Семь лун', 'ach:Семь миров ×5']];
  body = `<div class="body">
    <div class="prev"><div class="big win"><img src="${sk('026')}"></div>
      <div><span class="tier g">облик победителя</span><h3>Венец победителя</h3></div>
      <p>Открывается за победу в раунде и остаётся навсегда. На карте галактики планету окружает золотой ореол — его видят все игроки и боты.</p>
      <div class="who"><div class="card f"><span>Откуда</span><b>Раунд 2 · Врата построены</b></div><div class="card f"><span>Носят</span><b>3 командира из 101</b></div></div>
      <div class="acts"><button class="btn">Helion 01 ▾</button><button class="btn pri">Поставить</button></div></div>
    <div class="grid">
      <div class="sec"><b>Победителям и легендам</b><span>не покупаются: только за победы и редкие достижения</span></div><div class="tiles">${legend.map(tile).join('')}</div>
      <div class="sec"><b>Редкие</b><span>открываются, когда очков летописи накоплено столько, сколько указано</span></div><div class="tiles">${rare.map(tile).join('')}</div>
      <div class="sec"><b>Обычные</b><span>открыты всем · 40 обликов</span></div><div class="tiles">${common.map(tile).join('')}</div>
      <div class="scroll-fade"></div></div></div>`;
} else {
  const races = [['titan', 'Титан', 'самый крупный корабль'], ['goliath', 'Голиаф', 'тяжёлый линкор'], ['frigate', 'Фрегат', 'основа флота']];
  const looks = { titan: [['Стандарт', 'ok', 'on'], ['Чёрный бастион', 1200], ['Наследие Гелиона', 'за «Династию»']], goliath: [['Стандарт', 'ok', 'on'], ['Страж орбиты', 800, 'got'], ['Колосс', 1800]], frigate: [['Стандарт', 'ok'], ['Клинок', 500, 'on'], ['Тень', 'за «Тень»']] };
  const cmd = [['corsair', 'Корсар', 2, 1], ['hunter', 'Охотник', 1, 1], ['executioner', 'Палач', 2, 2], ['juggernaut', 'Джаггернаут', 1, 1], ['typhoon', 'Тайфун', 1, 1], ['viper', 'Вайпер', 3, 2], ['phantom', 'Фантом', 1, 1]];
  body = `<div class="grid" style="padding-top:6px">
    <div class="sec"><b>Флагманы Астеров</b><span>новый корпус целиком; цвета расы не меняются — по ним корабль узнают в бою</span></div>
    <div class="ships">${races.map(([k, n, d]) => `<div class="srow"><div class="nm"><b>${n}</b><span>${d}</span></div>${looks[k].map(([ln, s, f]) => {
      const open = s === 'ok' || (typeof s === 'number' && s <= pts) || f === 'got';
      const sub = s === 'ok' ? 'открыт' : typeof s === 'number' ? (open ? `открыт · ${fmt(s)} очков` : `<span class="lock">${fmt(s)} очков</span>`) : `<span class="lock">${s}</span>`;
      return `<div class="sv ${open ? '' : 'off'} ${f === 'on' ? 'on' : ''}"><img src="${A.ship('aegis', k)}"><div><b>${ln}${f === 'on' ? ' · выбран' : ''}</b><small>${sub}</small></div></div>`; }).join('')}</div>`).join('')}</div>
    <div class="sec"><b>Командиры</b><span>по 3 облика у каждого из 13; общие для всех рас</span></div>
    <div class="cmds">${cmd.map(([id, n, have, on]) => `<div class="cm"><img src="${A.commander(id)}"><b>${n}</b><div class="dots">${[1, 2, 3].map((i) => `<i class="${i === on ? 'on' : i <= have ? 'got' : ''}"></i>`).join('')}</div><small>${have} из 3 открыто</small></div>`).join('')}</div>
    <div class="note">Перекрасить корабль нельзя: <b>цвет расы остаётся всегда</b>. Тёмные карточки — эскизы, картинки будут нарисованы в одном стиле с игрой.</div>
  </div>`;
}
document.getElementById('a').innerHTML = nav('look') + `<div class="pan main">${tabs}${body}</div>`;
</script></body></html>
