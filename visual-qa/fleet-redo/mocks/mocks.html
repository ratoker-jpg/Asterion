<!doctype html>

<style>

.rail{position:absolute;left:68px;top:216px;bottom:26px;width:236px;display:flex;flex-direction:column;gap:14px}

.seg{position:absolute;left:68px;top:142px;display:flex;gap:6px}.seg .s{height:56px;padding:0 24px;border-radius:13px;background:rgba(14,26,34,.8);display:flex;align-items:center;font-size:18px;font-weight:800;color:#a9cbd3}.seg .s.on{background:linear-gradient(180deg,rgba(95,155,255,.32),rgba(95,155,255,.1));color:#fff;box-shadow:inset 0 -3px 0 var(--acc)}

</style></head><body>
<div id="out"></div>
<script>
const R='../../../assets/source/New assets/';const S=n=>R+'ship/aegis/ship.aegis.'+n+'.png';const D=n=>R+'defenses/aegis/defense.aegis.'+n+'.png';

const cat=[['Спутник','Солнечный спутник',S('solar-satellite'),'0','500','2 000','500','1','0:01'],['Зонд','Шпионский зонд',S('spy-probe'),'8','0','1 000','0','1','0:01'],['Транспорт','Транспортировщик',S('transporter'),'1 250','2 400','1 400','0','1','0:01'],['Мегатранспорт','Мегатранспортировщик',S('mega-transporter'),'123 456 789','6 400','5 000','0','3','0:01'],['Колонизатор','Колониальный корабль',S('colonizer'),'3','10 500 000','24 000 000','12 250 000','12','1:12'],['Переработчик','Сбор обломков',S('recycler'),'77','10 200','6 800','2 000','4','0:05'],['Скаут','Лёгкий истребитель',S('scout'),'94','3 000','1 000','0','2','0:02'],['Линкор','Тяжёлый корабль',S('battleship'),'430','45 000','15 000','0','15','0:12'],['Разрушитель','Охотник на корабли',S('destroyer'),'167','60 000','50 000','15 000','30','0:18'],['Бомбардировщик','Против обороны',S('bomber'),'2','50 000','25 000','15 000','22','0:20'],['Крейсер','Средний корабль',S('cruiser'),'12 500','20 000','7 000','2 000','8','0:08'],['Звезда смерти','Главный калибр',S('death-star'),'1','5 000 000','4 000 000','1 000 000','500','9:00']];
const cost=(k,v,bad)=>`<span class="cost num${bad?' bad':''}"><img src="${I(k)}">${v}</span>`;
const tile=(s,sel)=>`<div class="tile${sel?' sel':''}"><img src="${S(s[0])}"><div><h3>${s[1]}</h3></div><div class="have">на планете <b class="num">${s[2]}</b></div><div class="ctl"><div class="inp num">${sel?s[2]:'0'}</div><span class="btn">Макс.</span></div></div>`;

const card=c=>`<div class="card"><img class="a" src="${c[2]}"><div><h3>${c[0]}</h3><div class="st">${c[1]}</div><div class="st">Есть <b class="num">${c[3]}</b></div><div class="st">За штуку <b class="num">${c[8]}</b></div></div><div class="cs">${cost('metal',c[4])}${cost('mineral',c[5])}${cost('gas',c[6])}${cost('population',c[7])}</div><div class="amt"><div class="inp num">0</div><span class="btn">Макс.</span><span class="btn">Мин.</span><span class="btn pri">Построить</span></div></div>`;
const vcard=c=>`<div class="vcard"><img class="a" src="${c[2]}"><h3>${c[0]}</h3><div class="st">Есть <b class="num">${c[3]}</b> · за штуку <b class="num">${c[8]}</b></div><div class="cs">${cost('metal',c[4])}${cost('mineral',c[5])}${cost('gas',c[6])}${cost('population',c[7])}</div><div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px"><div class="inp num">0</div><span class="btn">Макс.</span></div><span class="btn pri">Построить</span></div>`;
const dockIn=`<div><span class="big num">12 502</span><small>кораблей выбрано</small></div><div><span class="big num">187 530</span><small>население флота</small></div><div><span class="big num">0 / 16</span><small>полётов занято</small></div><div style="color:#a9cbd3;font-size:16px">Цель выберете на следующем шаге</div><span class="btn pri go">Дальше: план перелёта</span>`;

const strip=`<div class="strip"><span>В пути <b>0</b></span><span>Спутники на орбите <b>0</b></span><span style="margin-left:auto" class="btn">Шпионские отчёты</span><span class="btn">Все рейсы</span></div>`;
const rail=(a)=>`<div class="rail"><div class="grp b"><div class="t">Строительство</div>${['Корабли','Оборона','Командирские корабли','Ремонтная мастерская'].map(t=>`<span class="ri${t==a?' on':''}"><img src="${S('battleship')}">${t}</span>`).join('')}</div><div class="grp m"><div class="t">Управление флотом</div>${['Отправка флота','Боевой приоритет','Битвы','Симулятор'].map(t=>`<span class="ri${t==a?' on':''}">${t}</span>`).join('')}</div></div>`;
const V={
aMain:()=>hdr()+wings('Отправка флота')+`<div style="position:absolute;left:68px;right:68px;top:216px;bottom:122px;display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:24px"><div style="display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px;min-height:0">${strip}<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;grid-auto-rows:min-content;overflow:hidden">${ships.slice(0,12).map((s,i)=>tile(s,i==2||i==3)).join('')}</div></div><div class="sur" style="padding:18px"><div class="lab" style="margin-bottom:10px">Миссия</div>${mgrid(4,'Атака')}<p style="margin-top:14px;font-size:17px;color:#cfe4ea"><b>Атака.</b> Боевой вылет против выбранной цели.</p><div class="lab" style="margin:16px 0 8px">Раундов боя</div><div style="display:flex;gap:6px"><span class="btn">5</span><span class="btn pri">8</span><span class="btn">12</span></div></div></div>`+dock,

bShips:()=>hdr()+rail('Корабли')+`<div style="position:absolute;left:324px;right:68px;top:216px;bottom:26px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-content:start;overflow:hidden">${cat.slice(0,9).map(card).join('')}</div>`,
cMain:()=>hdr()+`<div class="seg"><span class="s on">Отправка флота</span><span class="s">Строительство</span><span class="s">Управление</span></div><div class="ribbon">${mis.map(m=>`<div class="mi${m[1]=='Атака'?' on':''}"><img src="${M(m[0])}">${m[1]}</div>`).join('')}</div><div style="position:absolute;left:68px;right:68px;top:362px;bottom:122px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-content:start;overflow:hidden">${ships.slice(0,12).map((s,i)=>tile(s,i==2||i==3)).join('')}</div>`+dock,
